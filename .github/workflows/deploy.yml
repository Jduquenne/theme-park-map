name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /theme-park-map/
      - name: Ensure dev-only editor is absent from the bundle
        run: "! grep -rli 'poi-editor' dist/park-map-history/browser --include=*.js"
      - name: SPA fallback for deep links
        run: cp dist/park-map-history/browser/index.html dist/park-map-history/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/park-map-history/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
