<aside class="flex h-full w-72 flex-col gap-3 border-l border-slate-200 bg-white p-4">
  <button
    type="button"
    (click)="closed.emit()"
    class="-ml-1 flex items-center gap-1 self-start rounded px-1 py-0.5 text-xs font-medium text-slate-500 hover:text-slate-900"
  >
    <svg viewBox="0 0 16 16" class="size-3.5" fill="none" stroke="currentColor" stroke-width="1.75">
      <path d="M10 3l-5 5 5 5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    All points
  </button>

  <div>
    <span
      class="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-400"
    >
      <span class="size-2 rounded-full" [style.background-color]="color()"></span>
      {{ categoryLabel() }}
    </span>
    <h3 class="mt-1 text-base font-semibold leading-snug">{{ poi().name }}</h3>
  </div>

  @if (activeYears(); as years) {
    <p class="text-xs tabular-nums text-slate-500">Active {{ years }}</p>
  }

  @if (poi().description; as description) {
    <p class="text-sm leading-relaxed text-slate-700">{{ description }}</p>
  } @else {
    <p class="text-sm italic text-slate-400">No description recorded.</p>
  }
</aside>
