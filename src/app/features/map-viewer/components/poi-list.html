<aside class="flex h-full w-72 flex-col border-l border-slate-200 bg-white">
  <div class="border-b border-slate-100 px-4 py-3">
    <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">
      Points of interest
      <span class="ml-1 text-slate-300">{{ pois().length }}</span>
    </h3>
  </div>

  @if (pois().length) {
    <ul class="min-h-0 flex-1 divide-y divide-slate-100 overflow-y-auto">
      @for (poi of pois(); track poi.id) {
        <li>
          <button
            type="button"
            (click)="picked.emit(poi.id)"
            [attr.aria-current]="poi.id === selectedId() ? 'true' : null"
            class="flex w-full items-start gap-2.5 px-4 py-2.5 text-left text-sm hover:bg-slate-50"
            [class.bg-slate-100]="poi.id === selectedId()"
          >
            <span
              class="mt-1 size-2.5 shrink-0 rounded-full"
              [style.background-color]="color[poi.category]"
            ></span>
            <span class="min-w-0">
              <span class="block font-medium leading-tight">{{ poi.name }}</span>
              <span class="text-xs text-slate-400">{{ label[poi.category] }}</span>
            </span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="px-4 py-3 text-sm text-slate-400">No points visible at this year.</p>
  }
</aside>
