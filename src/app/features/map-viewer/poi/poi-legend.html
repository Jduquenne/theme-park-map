<div class="flex flex-wrap gap-1">
  <button
    type="button"
    (click)="showAll.emit()"
    [attr.aria-pressed]="allActive()"
    class="rounded-full border px-2.5 py-0.5 font-display text-[10px] font-semibold uppercase tracking-wide transition-colors"
    [class]="
      allActive()
        ? 'border-denim bg-denim-tint text-denim-ink'
        : 'border-line text-ink-soft hover:bg-parchment'
    "
  >
    All
  </button>
  @for (entry of entries(); track entry.category) {
    <button
      type="button"
      (click)="toggle.emit(entry.category)"
      [attr.aria-pressed]="!entry.hidden"
      [attr.aria-label]="'Toggle ' + label[entry.category] + ' markers'"
      class="flex items-center gap-1 rounded-full border px-2 py-0.5 font-display text-[10px] font-semibold uppercase tracking-wide transition-colors"
      [class]="
        entry.hidden
          ? 'border-line text-ink-soft/50'
          : 'border-denim/40 text-ink-soft hover:bg-parchment'
      "
    >
      <span
        class="size-2 rounded-full"
        [class.opacity-30]="entry.hidden"
        [style.background-color]="color[entry.category]"
      ></span>
      {{ label[entry.category] }}
      <span class="text-ink-soft/70">{{ entry.count }}</span>
    </button>
  }
</div>
