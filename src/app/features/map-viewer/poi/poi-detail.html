<aside class="flex h-full w-80 flex-col gap-3 border-l border-line bg-card p-4">
  <button
    type="button"
    (click)="closed.emit()"
    class="-ml-1 flex items-center gap-1 self-start rounded px-1 py-0.5 font-display text-[11px] font-semibold uppercase tracking-[0.12em] text-ink-soft hover:text-ink"
  >
    ‹ All points
  </button>

  <div>
    <span
      class="flex items-center gap-1.5 font-display text-[11px] font-semibold uppercase tracking-[0.12em] text-ink-soft"
    >
      <span class="size-2 rounded-full" [style.background-color]="color()"></span>
      {{ categoryLabel() }}
    </span>
    <h3 class="mt-1 font-display text-xl font-semibold uppercase tracking-[0.06em] text-ink">
      {{ poi().name }}
    </h3>
  </div>

  @if (activeYears(); as years) {
    <p
      class="self-start rounded border border-tan-line bg-tan px-2 py-0.5 text-xs tabular-nums text-ink-soft"
    >
      Active {{ years }}
    </p>
  }

  @if (poi().description; as description) {
    <p class="text-sm leading-relaxed text-ink-soft">{{ description }}</p>
  } @else {
    <p class="text-sm italic text-ink-soft/70">No description recorded.</p>
  }
</aside>
